<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Get in touch with the IEEE UBC Okanagan Student Branch on Instagram, Discord, and LinkedIn.">
  <meta name="theme-color" content="#102b40">
  <title>Contact | IEEE UBC Okanagan</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="IEEE UBC Okanagan home">
        <img src="/assets/brand_assets/ieee%20mb%20blue.png" width="99" height="29" alt="">
        <span class="brand-name">UBC Okanagan<small>Student Branch</small></span>
      </a>
      <nav aria-label="Main navigation">
        <ul class="nav-list">
          <li><a href="/">Home</a></li>
          <li><a href="/events/">Events</a></li>
          <li><a href="/our-team/">Our Team</a></li>
          <li><a href="/contact/" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="contact-page" id="main" tabindex="-1">
    <section class="page-intro">
      <div class="container">
        <h1>Contact</h1>
        <p class="lede">Have a question about an event or the student branch? Connect with us through any of these channels.</p>
      </div>
    </section>
    <section class="section contact-section" aria-labelledby="channels-heading">
      <div class="container">
        <div class="section-heading">
          <h2 id="channels-heading">Find us online</h2>
        </div>
        <ul class="social-grid">
          <li>
            <a class="social-logo" href="https://www.instagram.com/ubcoieee/">
              <img src="/assets/brand_assets/instagram.svg" alt="Instagram" width="56" height="56">
            </a>
          </li>
          <li>
            <a class="social-logo" href="https://discord.gg/yK6ws2bmB">
              <img src="/assets/brand_assets/discord.svg" alt="Discord" width="56" height="56">
            </a>
          </li>
          <li>
            <a class="social-logo" href="https://www.linkedin.com/company/ubco-ieee-student-branch/posts/">
              <img src="/assets/brand_assets/linkedin.svg" alt="LinkedIn" width="56" height="56">
            </a>
          </li>
        </ul>
      </div>
    </section>
  </main>
</body>
</html>
